<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CADwebSimu — simulador d'esquemes elèctrics</title>
<meta name="description" content="CADwebSimu: editor i simulador d'esquemes elèctrics de comandament i potència al navegador.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23003a8c'/%3E%3Cpath d='M16 4v8M16 20v8M10 12h12v8H10z' stroke='%23fff' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=20261113">
</head>
<body>
<div id="app">
  <nav id="menubar"></nav>
  <div id="toolbar1" class="toolbar"></div>
  <div id="toolbar2" class="toolbar"></div>
  <div id="catbar" class="toolbar"></div>
  <div id="symbar" class="toolbar symbar" hidden></div>
  <div id="sym-popover" hidden></div>
  <div id="modebar"></div>
  <div id="tabs"></div>
  <div id="canvaswrap"><canvas id="canvas" tabindex="0"></canvas><div id="props" hidden></div><canvas id="minimap" hidden></canvas></div>
  <footer id="statusbar">
    <span id="status">Preparat</span>
    <span class="right"><span id="legend" hidden></span><span id="mode">Edició</span><span id="simtime"></span><span id="zoom"></span><span id="coords"></span></span>
  </footer>
</div>
<div id="overlay" hidden><div id="dialog" role="dialog" aria-modal="true"></div></div>
<input type="file" id="fileinput" accept=".ecs,.json,application/json" hidden>
<script src="js/model.js?v=20261113"></script>
<script src="js/symbols.js?v=20261113"></script>
<script src="js/sim.js?v=20261113"></script>
<script src="js/render.js?v=20261113"></script>
<script src="js/examples.js?v=20261113"></script>
<script src="js/app.js?v=20261113"></script>
<script src="js/tools.js?v=20261113"></script>
<script src="js/editor.js?v=20261113"></script>
</body>
</html>
